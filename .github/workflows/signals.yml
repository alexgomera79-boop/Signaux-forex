name: Signaux forex

on:
  schedule:
    # Toutes les heures, à la minute 2 (heure UTC), du lundi au vendredi
    - cron: "2 * * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "test = message de test, run = analyse réelle"
        default: "test"

jobs:
  signals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Lancer
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "test" ]; then
            python signals.py --test
          else
            python signals.py
          fi
          
